# Matches the `stable` channel pinned in rust-toolchain.toml. The repo
# pins a channel rather than promising support for an older compiler, so
# a lower number here is not a compatibility guarantee — it only hides
# newer std APIs from clippy (which is what kept the deprecated
# `AtomicU32::fetch_update` in place after its rename to `try_update`).
msrv = "1.97.0"
cognitive-complexity-threshold = 30
too-many-lines-threshold = 100
# 8 rather than 7 because every JS-exposed action method carries a
# `CallSite` parameter that consumes no argument (rquickjs
# `ParamRequirement::none()`), so it does not count towards what a caller
# actually juggles — which is what this lint is about.
too-many-arguments-threshold = 8
type-complexity-threshold = 250
large-error-threshold = 256
allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
avoid-breaking-exported-api = false
future-size-threshold = 4096
# rquickjs throws these through QuickJS's 256-byte format buffer, so a
# longer message is cut, and each one reads "Error converting from js ...".
# Bindings throw through `convert::type_error` / `throw_named` instead.
disallowed-methods = [
  { path = "rquickjs::Error::new_from_js_message", reason = "cut at 255 bytes and mislabelled; use convert::type_error or throw_named" },
  { path = "rquickjs::Error::new_from_js", reason = "mislabelled conversion error; use convert::type_error or throw_named" },
  { path = "rquickjs::Error::new_into_js_message", reason = "cut at 255 bytes and mislabelled; use convert::type_error or throw_named" },
  { path = "rquickjs::Error::new_into_js", reason = "mislabelled conversion error; use convert::type_error or throw_named" },
]

[package]
name = "ferridriver-viewer"
description = "Embedded Playwright-compatible web apps (trace viewer, UI mode, recorder, HTML report) and the routes that feed them."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The routes that serve the apps and traces, and opening an app window.
# Without it the crate is the embedded assets, the trace model and the dump.
server = ["dep:ferridriver", "dep:axum", "dep:tokio", "dep:tower", "dep:tower-http"]

[dependencies]
ferridriver-trace = { workspace = true }
ferridriver = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
rustc-hash = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
mime_guess = "2"
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["fs"], optional = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "ferridriver-cli"
description = "ferridriver CLI -- MCP server for browser automation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "ferridriver"
path = "src/main.rs"

[lints]
workspace = true

[features]
profiling = ["ferridriver-test/profiling"]

[dependencies]
async-trait = { workspace = true }
ferridriver-mcp = { workspace = true }
ferridriver-script = { workspace = true }
ferridriver-config = { workspace = true }
ferridriver-test = { workspace = true }
ferridriver-bdd = { workspace = true }
ferridriver-testjs = { workspace = true }
ferridriver-session = { workspace = true }
ferridriver-viewer = { workspace = true }
ferridriver = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
console = "0.16"
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = { workspace = true }
which = { workspace = true }
# `ext dev --watch` polls one file watcher per extension root; a
# dynamic set of roots needs `select_all`, not a fixed `tokio::select!`.
futures = { workspace = true }
toml = "1"
# `ext check` writes a generated tsconfig + the embedded type
# declarations into a scratch dir for the TypeScript pass.
tempfile = "3"

[dev-dependencies]
serde_json = { workspace = true }
sha1 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
base64 = { workspace = true }
tokio-tungstenite = "0.30"
futures = { workspace = true }
tempfile = "3"
libc = "0.2"

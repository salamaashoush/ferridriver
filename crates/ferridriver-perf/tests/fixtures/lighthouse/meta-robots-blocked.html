<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A page that asks not to be indexed</title>
<meta name="description" content="Blocked by the first of is-crawlable's three sources and by neither of the others.">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<main>
  <h1>Noindex</h1>
  <p>The generic robots meta applies to every crawler, so no bot is left able to index this.</p>
</main>
</body>
</html>

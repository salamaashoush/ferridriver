[package]
name = "ferridriver-config"
description = "Unified configuration loader for ferridriver: composes mcp + test sections from a single ferridriver.toml"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
ferridriver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
serde_yaml = "0.9"
anyhow = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
shellexpand = { workspace = true }
config = { workspace = true }
serde_ignored = "0.1"
# Names the exact field path in a deserialization error. serde alone
# reports `invalid type: string, expected a sequence` with no clue which
# key it means, which is useless in an extension author's package.json.
serde_path_to_error = "0.1"

[dev-dependencies]
tempfile = "3"

[package]
name = "rust-e2e-example"
version = "0.1.0"
edition = "2024"
publish = false

# The E2E test binary -- uses ferridriver's TestRunner, not libtest.
[[test]]
name = "e2e"
harness = false

[dependencies]
ferridriver = { path = "../../crates/ferridriver" }
ferridriver-test = { path = "../../crates/ferridriver-test" }
# Linking the scripting engine is what makes `cargo test --test e2e --
# --debug` able to stop a test and publish its browser as a session: it
# registers the runner's session publisher.
ferridriver-script = { path = "../../crates/ferridriver-script" }
tokio = { workspace = true }

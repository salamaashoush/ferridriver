[workspace]
resolver = "2"
members = ["crates/*", "examples/bdd-example", "examples/rust-e2e"]
default-members = [
  "crates/ferridriver",
  "crates/ferridriver-config",
  "crates/ferridriver-mcp",
  "crates/ferridriver-cli",
  "crates/ferridriver-bdd",
  "crates/ferridriver-bdd-macros",
  "crates/ferridriver-test",
  "crates/ferridriver-test-macros",
  "crates/ferridriver-fixtures",
  "crates/ferridriver-script",
  "crates/ferridriver-session",
  "crates/ferridriver-node",
  "crates/ferridriver-expect",
  "crates/ferridriver-perf",
  "crates/ferridriver-heap",
  "crates/ferridriver-viewer",
  "crates/ferridriver-trace",
  "crates/ferridriver-types",
  "crates/ferridriver-error",
  "crates/ferridriver-process",
  "crates/ferridriver-driver",
  "crates/ferridriver-audits",
  "crates/ferridriver-install",
  "crates/ferridriver-cdp-proto",
  "crates/ferridriver-bidi-proto",
  "crates/ferridriver-webkit-proto",
  "crates/ferridriver-webdriver-proto",
  "crates/ferridriver-codegen",
  "examples/bdd-example",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["Salama Ashoush"]
repository = "https://github.com/salamaashoush/ferridriver"
homepage = "https://salamaashoush.github.io/ferridriver/"
readme = "README.md"
keywords = ["browser", "automation", "playwright", "cdp", "testing"]
categories = ["development-tools::testing", "web-programming"]

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
unit_bindings = "deny"
meta_variable_misuse = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
impl_trait_redundant_captures = "deny"
non_ascii_idents = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
dbg_macro = "deny"
# Suppressions carry a reason and fail once the lint stops firing.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Unsafe hygiene.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
as_ptr_cast_mut = "deny"
default_union_representation = "deny"
fn_to_numeric_cast_any = "deny"
mem_forget = "deny"
# Library code reports failure instead of panicking or exiting: an exit
# skips the destructors that kill browser process groups.
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
string_slice = "deny"
fallible_impl_from = "deny"
infinite_loop = "deny"
# Locking and async.
significant_drop_in_scrutinee = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
needless_pass_by_ref_mut = "deny"
# Allocation and wasted work.
redundant_clone = "deny"
rc_buffer = "deny"
or_fun_call = "deny"
set_contains_or_insert = "deny"
read_zero_byte_vec = "deny"
verbose_file_reads = "deny"
large_include_file = "deny"
large_stack_frames = "deny"
clone_on_ref_ptr = "deny"
unused_peekable = "deny"
clear_with_drain = "deny"
string_lit_chars_any = "deny"
# The MCP server speaks JSON-RPC on stdout.
print_stdout = "deny"
debug_assert_with_mut_call = "deny"
path_buf_push_overwrite = "deny"
empty_drop = "deny"
mixed_read_write_in_expression = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
uninhabited_references = "deny"
try_err = "deny"
rest_pat_in_fully_bound_structs = "deny"

[workspace.dependencies]
ferridriver = { path = "crates/ferridriver", version = "0.8.1" }
ferridriver-mcp = { path = "crates/ferridriver-mcp", version = "0.8.1" }
ferridriver-perf = { path = "crates/ferridriver-perf", version = "0.8.1" }
ferridriver-heap = { path = "crates/ferridriver-heap", version = "0.8.1" }
ferridriver-test = { path = "crates/ferridriver-test", version = "0.8.1" }
ferridriver-test-macros = { path = "crates/ferridriver-test-macros", version = "0.8.1" }
ferridriver-bdd = { path = "crates/ferridriver-bdd", version = "0.8.1" }
ferridriver-bdd-macros = { path = "crates/ferridriver-bdd-macros", version = "0.8.1" }
ferridriver-script = { path = "crates/ferridriver-script", version = "0.8.1" }
ferridriver-testjs = { path = "crates/ferridriver-testjs", version = "0.8.1" }
ferridriver-config = { path = "crates/ferridriver-config", version = "0.8.1" }
ferridriver-expect = { path = "crates/ferridriver-expect", version = "0.8.1" }
ferridriver-session = { path = "crates/ferridriver-session", version = "0.8.1" }
ferridriver-viewer = { path = "crates/ferridriver-viewer", version = "0.8.1" }
ferridriver-trace = { path = "crates/ferridriver-trace", version = "0.8.1" }
ferridriver-types = { path = "crates/ferridriver-types", version = "0.8.1" }
ferridriver-error = { path = "crates/ferridriver-error", version = "0.8.1" }
ferridriver-process = { path = "crates/ferridriver-process", version = "0.8.1" }
ferridriver-driver = { path = "crates/ferridriver-driver", version = "0.8.1" }
ferridriver-audits = { path = "crates/ferridriver-audits", version = "0.8.1" }
ferridriver-install = { path = "crates/ferridriver-install", version = "0.8.1" }
ferridriver-cdp-proto = { path = "crates/ferridriver-cdp-proto", version = "0.8.1" }
ferridriver-bidi-proto = { path = "crates/ferridriver-bidi-proto", version = "0.8.1" }
ferridriver-webkit-proto = { path = "crates/ferridriver-webkit-proto", version = "0.8.1" }
ferridriver-webdriver-proto = { path = "crates/ferridriver-webdriver-proto", version = "0.8.1" }
ferridriver-codegen = { path = "crates/ferridriver-codegen", version = "0.8.1" }
# The JavaScript runtime this project's scripting is built on. To develop
# the two together, point these back at `../ferrijs/crates/*` with a
# `[patch.crates-io]` section rather than editing the versions here.
# `intl`: spec code calls `Intl`, `localeCompare` and `toLocaleString`
# as it does under Node, so the runner's realms carry ICU4X's.
ferrijs = { version = "0.10.1", features = ["intl"] }
ferrijs-std = "0.10.1"
ferrijs-fetch = "0.10.1"
ferrijs-bundle = "0.10.1"
ferrijs-permissions = "0.10.1"
ferrijs-serde = "0.10.1"

tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.23"
regex = "1"
async-trait = "0.1"
libc = "0.2"
rustix = { version = "1", features = ["process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-chrome = "0.7"
console-subscriber = "0.5"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
flate2 = "1"
sha2 = "0.11"
ring = "0.17"
semver = "1"
rmcp = { version = "3.9", features = ["server", "transport-io", "transport-streamable-http-server", "tower"] }
schemars = "1"
jsonschema = { version = "0.60", default-features = false }
axum = "0.8"
tokio-util = "0.7"
dashmap = "6"
arc-swap = "1"
mimalloc = { version = "0.1", default-features = false }
shellexpand = "3"
dirs = "7"
which = "8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[profile.dev]
debug = false

# Optimizing dependencies keeps the binary's __eh_frame under the 16MB ceiling
# Apple's ld needs to encode unwind offsets in the compact unwind table. Workspace
# crates stay at opt-level 0 so incremental rebuilds are unaffected.
[profile.dev.package."*"]
opt-level = 1

# The QuickJS bindings and the MCP tool router are macro-generated glue whose
# unoptimized unwind tables alone take the rest of the room under that ceiling.
[profile.dev.package.ferridriver-script]
opt-level = 1

[profile.dev.package.ferridriver-mcp]
opt-level = 1

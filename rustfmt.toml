edition = "2024"
# Vendored third-party sources (see crates/ferridriver-jsstd/README.md).
# Reformatting them to the house style would make every future diff against
# upstream llrt unreadable.
#
# `ignore` is nightly-only: on the stable channel this repo pins, rustfmt
# warns and formats the crate regardless. The guard that actually holds is
# `crates/ferridriver-jsstd/rustfmt.toml` (`disable_all_formatting`), which
# rustfmt picks up as the config nearest those sources. Keep both.
ignore = ["crates/ferridriver-jsstd"]
max_width = 120
hard_tabs = false
tab_spaces = 2
newline_style = "Unix"
use_field_init_shorthand = true
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
fn_params_layout = "Tall"
remove_nested_parens = true
match_block_trailing_comma = true
force_explicit_abi = true
merge_derives = true

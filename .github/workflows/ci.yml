name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTDOCFLAGS: -Dwarnings

# ---------------------------------------------------------------------------
# Gate: cheap jobs that must pass before expensive ones run
# ---------------------------------------------------------------------------
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1

  typecheck:
    name: Typecheck e2e specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      # The specs are typed against `packages/ferridriver-test`, which is
      # written by hand rather than generated. A binding can ship with no
      # declaration and nothing else notices — `checkAccessibility` and
      # `strictSelectors` both did.
      - name: Typecheck
        working-directory: tests
        run: bun x tsc --noEmit -p tsconfig.json

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system deps
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            libclang-dev pkg-config
      - run: |
          cargo clippy --workspace --all-targets \
            --exclude bdd-example -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system deps
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            libclang-dev pkg-config
      - run: |
          cargo doc --workspace --no-deps \
            --exclude bdd-example

  # Gate job: all cheap checks must pass
  basics:
    name: Basics gate
    runs-on: ubuntu-latest
    needs: [fmt, typos, typecheck, clippy, doc]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ||
                "${{ needs.typos.result }}" != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.clippy.result }}" != "success" ||
                "${{ needs.doc.result }}" != "success" ]]; then
            echo "One or more basic checks failed"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Tests: run after basics gate passes
  # ---------------------------------------------------------------------------
  test:
    # One job per suite, each running the same `cargo gate test --only`
    # a developer runs locally. A suite alone on its runner gets every
    # browser slot, so a slow suite cannot starve the others or run into
    # the gate's per-suite limit, and a failure names its suite. macOS
    # covers WebKit, Chromium, the addon and the Rust tests; Firefox runs
    # on Linux.
    name: Test (${{ matrix.os }}, ${{ matrix.id }})
    needs: [basics]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, id: e2e-cdp-pipe, gate: --only e2e --project cdp-pipe }
          - { os: ubuntu-latest, id: e2e-cdp-raw, gate: --only e2e --project cdp-raw }
          - { os: ubuntu-latest, id: e2e-bidi, gate: --only e2e --project bidi }
          - { os: ubuntu-latest, id: e2e-webkit, gate: --only e2e --project webkit }
          - { os: ubuntu-latest, id: integration, gate: --only integration }
          - { os: ubuntu-latest, id: bdd, gate: --only bdd }
          - { os: ubuntu-latest, id: acceptance, gate: --only acceptance --only acceptance-bdd }
          - { os: ubuntu-latest, id: napi, gate: --only napi }
          - { os: ubuntu-latest, id: rust, gate: --only rust-build --only doc-tests }
          - { os: macos-latest, id: e2e-webkit, gate: --only e2e --project webkit }
          - { os: macos-latest, id: e2e-cdp-pipe, gate: --only e2e --project cdp-pipe }
          - { os: macos-latest, id: napi, gate: --only napi }
          - { os: macos-latest, id: rust, gate: --only rust-build --only doc-tests }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The browser suites all build the same binaries and share one
      # cache; the Rust suite builds every test target and keeps its own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.id == 'rust' && 'rust' || 'browser' }}
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.id == 'rust' || matrix.id == 'e2e-webkit') }}
      - uses: oven-sh/setup-bun@v2

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        # Build-time deps only — browser runtime deps come from
        # `ferridriver install --with-deps` below.
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            libclang-dev pkg-config ffmpeg

      # Ubuntu 24.04 denies unprivileged user namespaces, which Chromium's
      # sandbox needs whenever `--no-sandbox` is not among its arguments.
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config llvm ffmpeg

      - name: Install JavaScript build dependencies
        run: bun install --frozen-lockfile

      - name: Build browser installer and test binaries
        run: cargo build --locked --workspace --bins --lib

      - name: Install browsers and accessibility engine
        run: target/debug/ferridriver install --with-deps chromium firefox webkit axe

      # The WebDriver tests drive ChromeDriver. Under it the image's own
      # Chromium sat 20s and more in startup, past the test's budget, with
      # both test variants' browsers released at the same instant. The
      # Chrome for Testing build every other suite launches gets the
      # ChromeDriver published for that exact version instead.
      - name: Pair ChromeDriver with the installed Chromium (Linux)
        if: runner.os == 'Linux' && matrix.id == 'integration'
        run: |
          chrome=$(ls -d "$HOME"/.cache/ferridriver/chromium-*/chrome-linux64/chrome | sort -V | tail -1)
          version=$(basename "$(dirname "$(dirname "$chrome")")")
          version=${version#chromium-}
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/chromedriver.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chromedriver-linux64.zip"
          unzip -q -o "$RUNNER_TEMP/chromedriver.zip" -d "$RUNNER_TEMP"
          echo "FERRIDRIVER_CHROMEDRIVER=$RUNNER_TEMP/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
          echo "FERRIDRIVER_WEBDRIVER_CHROME=$chrome" >> "$GITHUB_ENV"

      # The gate's default of 32 browser slots is sized for a desktop. The
      # hosted runners have 4 vCPUs on Linux and 3 on macOS.
      - name: Run ${{ matrix.id }}
        run: cargo gate test ${{ matrix.gate }}
        env:
          FERRIDRIVER_GATE_WORKERS: ${{ runner.os == 'macOS' && 3 || 4 }}
          FERRIDRIVER_GATE_TIMEOUT: 1800

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.os }}-${{ matrix.id }}
          path: target/gate/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Security: audit dependencies for known vulnerabilities
  # ---------------------------------------------------------------------------
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          createIssues: false

  # ---------------------------------------------------------------------------
  # Lockfile: ensure Cargo.lock is committed and up to date
  # ---------------------------------------------------------------------------
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            libclang-dev pkg-config
      - run: cargo check --locked --workspace

  # ---------------------------------------------------------------------------
  # Conclusion: aggregator for branch protection rules
  # ---------------------------------------------------------------------------
  conclusion:
    name: CI conclusion
    if: always()
    needs:
      - test
      - security
      - lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        run: |
          jq -e 'all(.[]; .result == "success")' <<< '${{ toJson(needs) }}'
